services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: leadpilot
      POSTGRES_DB: leadpilot
    ports: ["5432:5432"]
    volumes: [leadpilot_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  leadpilot_pg:
